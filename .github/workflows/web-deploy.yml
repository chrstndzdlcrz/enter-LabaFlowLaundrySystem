name: Web build and deploy

# Builds the LabaFlow web app and deploys the static bundle to GitHub Pages.
#
# OWNER SETUP (required, cannot be done by the agent):
#   1. Repository settings -> Pages -> Source: "GitHub Actions".
#   2. If the site will live at a custom domain, set it there too; the build uses
#      the repository name as the base path otherwise.
#   3. No secrets are needed for the build itself: the publishable key baked into
#      src/integrations/supabase/client.ts is safe to ship, because every table is
#      protected by row level security.
#
# This workflow has NOT been executed or verified from the development sandbox.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check and lint
        run: pnpm check

      - name: Build for the repository base path
        run: pnpm exec vite build --base=/${{ github.event.repository.name }}/

      - name: Add a single-page-app fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
