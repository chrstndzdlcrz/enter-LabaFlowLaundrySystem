name: Web build and deploy

# Builds the LabaFlow web app and publishes it to GitHub Pages.
#
# ONE-TIME OWNER STEP (cannot be done by the agent):
#   Repository -> Settings -> Pages -> Source: "GitHub Actions".
#   Nothing else is needed: the publishable client key that ships in the bundle is
#   safe in public, because every table is protected by row level security.
#
# The site URL will be either:
#   https://<user>.github.io/<repo>/    (a normal repository)
#   https://<user>.github.io/           (a repository named <user>.github.io,
#                                        or any repository with a custom domain)
# The base path is worked out automatically below, so both work without edits.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check and lint
        run: pnpm check

      - name: Work out the Pages base path
        id: pages
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO/" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5

      - name: Build for the Pages base path
        run: pnpm exec vite build --base=${{ steps.pages.outputs.base }}

      - name: Add the single-page-app fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
