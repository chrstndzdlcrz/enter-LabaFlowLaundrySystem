name: Mobile app build (Flutter)

# Builds the LabaFlow Flutter app in mobile/ and publishes installable artifacts.
#
# OWNER SETUP (required, cannot be done by the agent):
#   1. Create a Firebase project for the shop and add an Android app with the
#      package name from mobile/android/app/build.gradle.
#   2. Store the two files as repository secrets (base64):
#        GOOGLE_SERVICES_JSON_BASE64   -> mobile/android/app/google-services.json
#        FCM_SERVICE_ACCOUNT_BASE64    -> the Firebase service account JSON used by
#                                         the dispatch-push backend function
#   3. Without those secrets the workflow still builds an APK, but background push
#      and any Firebase-dependent features will not work.
#
# This workflow has NOT been executed or verified from the development sandbox:
# no Flutter SDK is available there, so the mobile source has never been compiled.

# This workflow is manual-only on purpose. It cannot succeed until the Flutter
# platform folders exist, which requires running `flutter create` once inside
# mobile/ (see mobile/README.md). Running it automatically would only produce a
# failing run on every push, so trigger it by hand once that setup is done:
#   Actions -> "Mobile app build (Flutter)" -> Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode Firebase configuration when provided
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Fetch packages
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Build release App Bundle
        run: flutter build appbundle --release --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: labaflow-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: labaflow-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
