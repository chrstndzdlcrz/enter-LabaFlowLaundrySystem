name: Mobile app build (Flutter)

# Builds an installable Android APK (and a Play Store bundle) in GitHub's cloud, so
# the shop does not need Flutter, Android Studio or a developer machine.
#
# OWNER SETUP (one time, cannot be done by the agent):
#   Repository -> Settings -> Secrets and variables -> Actions -> Variables:
#     SUPABASE_URL              = the backend URL from src/integrations/supabase/client.ts
#     SUPABASE_PUBLISHABLE_KEY  = the publishable key from the same file
#   Without those two, the APK installs but shows "LabaFlow is not configured".
#
# Optional, only for background push: GOOGLE_SERVICES_JSON_BASE64.
#
# The Android platform folder is generated here on the runner, so the repository
# never carries a hand-written Gradle scaffold.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check the backend values are present
        run: |
          if [ -z "${{ vars.SUPABASE_URL }}" ] || [ -z "${{ vars.SUPABASE_PUBLISHABLE_KEY }}" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY are not set. The APK will build but will show 'LabaFlow is not configured'."
          fi

      - name: Generate the Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org io.labaflow --project-name labaflow .
          fi

      - name: Decode Firebase configuration when provided
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Fetch packages
        run: flutter pub get

      - name: Analyse (reported, never blocks the APK)
        continue-on-error: true
        run: flutter analyze

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Build release App Bundle
        run: >
          flutter build appbundle --release
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: labaflow-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload the App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: labaflow-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
